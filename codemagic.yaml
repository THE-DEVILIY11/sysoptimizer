workflows:
  android-workflow:
    name: Build APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      java: 17
      android_sdk:
        build_tools: "34.0.0"
    scripts:
      - name: Build APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
    publishing:
      email:
        recipients:
          - your-email@example.com
