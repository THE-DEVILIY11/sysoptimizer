workflows:
  android-workflow:
    name: Build APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    scripts:
      - name: Create root Gradle files
        script: |
          if [ ! -f build.gradle ]; then
            cat > build.gradle << 'EOF'
          buildscript {
              ext.kotlin_version = '1.9.0'
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.0'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          EOF
          fi

          if [ ! -f settings.gradle ]; then
            cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "sysoptimizer"
          include ':app'
          EOF
          fi

      - name: Ensure app/ directory exists
        script: |
          mkdir -p app/src/main

      - name: Create minimal app/build.gradle if missing
        script: |
          if [ ! -f app/build.gradle ]; then
            cat > app/build.gradle << 'EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.sysopt.booster'
              compileSdk 34
              defaultConfig {
                  applicationId "com.sysopt.booster"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.13.1'
              implementation 'androidx.appcompat:appcompat:1.7.0'
          }
          EOF
          fi

      - name: Create minimal AndroidManifest.xml if missing
        script: |
          if [ ! -f app/src/main/AndroidManifest.xml ]; then
            cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.sysopt.booster">
              <application
                  android:allowBackup="true"
                  android:label="System Optimizer">
                  <activity android:name=".MainActivity">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          fi

      - name: Install Gradle
        script: |
          brew install gradle

      - name: Build APK
        script: |
          gradle assembleDebug

    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
