workflows:
  android-workflow:
    name: Build APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    scripts:
      - name: Generate Gradle Wrapper
        script: |
          if [ ! -f gradlew ]; then
            gradle wrapper
          fi
          chmod +x gradlew
      - name: Build APK
        script: |
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
