workflows:
  android-workflow:
    name: Build APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    scripts:
      # 1. Create root Gradle files if missing
      - name: Create root Gradle files
        script: |
          if [ ! -f build.gradle ]; then
            cat > build.gradle << 'EOF'
          buildscript {
              ext.kotlin_version = '1.9.0'
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.0'
                  classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          task clean(type: Delete) {
              delete rootProject.buildDir
          }
          EOF
          fi

          if [ ! -f settings.gradle ]; then
            cat > settings.gradle << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "sysoptimizer"
          include ':app'
          EOF
          fi

      # 2. Install Gradle via Homebrew (avoids wrapper download issues)
      - name: Install Gradle
        script: |
          brew install gradle

      # 3. Build using system Gradle (no wrapper)
      - name: Build APK
        script: |
          gradle assembleDebug

    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
